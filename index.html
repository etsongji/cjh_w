<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>충주고 주간업무표</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --bg:#f0ece4; --paper:#faf8f4; --paper2:#f5f1e8; --white:#ffffff;
  --line:#ddd8ce; --line2:#e8e4dc;
  --ink:#1a1f2e; --ink2:#3d4460; --ink3:#6b7280; --ink4:#9ca3af;
  --accent:#2a5caa; --accent-bg:rgba(42,92,170,.08); --accent-bdr:rgba(42,92,170,.2);
  --green:#1a7a4a; --green-bg:rgba(26,122,74,.08); --gold:#b8962e; --red:#c0392b;
  --c-교무:#2a5caa; --c-연구:#1a7a4a; --c-학년부:#b8962e; --c-행정:#9b2c8e; --c-기타:#6d4eb4;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);}
body{display:flex;flex-direction:column;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--line2) 1px,transparent 1px),linear-gradient(90deg,var(--line2) 1px,transparent 1px);background-size:28px 28px;opacity:.5;pointer-events:none;z-index:0;}

/* PC 헤더 */
header{position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:56px;background:var(--white);border-bottom:2px solid var(--line);box-shadow:0 4px 16px rgba(0,0,0,.06);flex-shrink:0;gap:12px;}
header::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--gold),var(--accent));}
.logo{display:flex;align-items:center;gap:8px;font-family:'Noto Serif KR',serif;font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap;flex-shrink:0;}
.logo-mark{width:30px;height:30px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;}
.week-nav{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.nav-btn{width:30px;height:30px;background:var(--paper2);border:1px solid var(--line);border-radius:7px;color:var(--ink3);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.nav-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
.week-label{font-size:13px;font-weight:600;color:var(--ink2);min-width:150px;text-align:center;font-family:'Noto Serif KR',serif;}
.today-btn{padding:0 12px;height:30px;background:var(--paper2);border:1px solid var(--line);border-radius:7px;font-size:12px;font-weight:600;color:var(--ink3);cursor:pointer;transition:all .15s;font-family:inherit;}
.today-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
.hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.btn{padding:7px 14px;border-radius:7px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;border:none;transition:all .15s;white-space:nowrap;}
.btn-refresh{background:var(--green-bg);border:1px solid rgba(26,122,74,.3);color:var(--green);}
.btn-refresh:hover{background:var(--green);color:#fff;}
.btn-copy{background:var(--paper2);border:1px solid var(--line);color:var(--ink3);}
.btn-copy:hover{background:var(--ink2);color:#fff;border-color:var(--ink2);}
.btn-subscribe{background:var(--accent);color:#fff;}
.btn-subscribe:hover{background:#1e4488;transform:translateY(-1px);box-shadow:0 3px 12px rgba(42,92,170,.25);}


/* API 배너 */

/* 메인 */
.main{display:flex;flex:1;overflow:hidden;position:relative;z-index:1;}

/* PC 사이드바 */
.sidebar{width:54px;background:var(--white);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:5px;flex-shrink:0;box-shadow:2px 0 8px rgba(0,0,0,.04);}
.d-tab{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid transparent;transition:all .15s;}
.d-tab.all{background:var(--paper2);color:var(--ink3);font-size:9px;}
.d-tab.교무{background:rgba(42,92,170,.1);color:var(--c-교무);}
.d-tab.연구{background:rgba(26,122,74,.1);color:var(--c-연구);}
.d-tab.학년부{background:rgba(184,150,46,.1);color:var(--c-학년부);}
.d-tab.행정{background:rgba(155,44,142,.1);color:var(--c-행정);}
.d-tab.기타{background:rgba(109,78,180,.1);color:var(--c-기타);}
.d-tab:hover,.d-tab.active{border-color:currentColor;box-shadow:0 2px 8px rgba(0,0,0,.1);}
.d-tab.all.active{border-color:var(--accent);color:var(--accent);background:var(--accent-bg);}
.sidebar-sep{width:24px;height:1px;background:var(--line);margin:4px 0;}

/* 그리드 */
.grid-wrap{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch;}





/* 이벤트 블록 */


/* 로딩 */
.lov{position:absolute;inset:0;background:rgba(240,236,228,.7);display:flex;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(2px);}
.lov.hide{display:none;}
.spin{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}

/* 입력 팝업 */
.input-popup{position:fixed;z-index:200;background:var(--white);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.15);padding:16px 18px;width:310px;display:none;}
.input-popup.on{display:block;animation:popIn .12s ease;}
@keyframes popIn{from{opacity:0;transform:scale(.96) translateY(4px)}to{opacity:1;transform:scale(1) translateY(0)}}
.pr{display:flex;gap:8px;margin-bottom:12px;align-items:center;}
.pl{font-size:10px;font-weight:700;color:var(--ink3);min-width:28px;flex-shrink:0;letter-spacing:.06em;text-transform:uppercase;}
.pd-btns{display:flex;gap:4px;flex-wrap:wrap;}
.pd-btn{padding:3px 8px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid transparent;transition:all .12s;font-family:inherit;}
.pd-btn.교무{background:rgba(42,92,170,.1);color:var(--c-교무);}
.pd-btn.연구{background:rgba(26,122,74,.1);color:var(--c-연구);}
.pd-btn.학년부{background:rgba(184,150,46,.1);color:var(--c-학년부);}
.pd-btn.행정{background:rgba(155,44,142,.1);color:var(--c-행정);}
.pd-btn.기타{background:rgba(109,78,180,.1);color:var(--c-기타);}
.pd-btn.active{border-color:currentColor;}
.pi{width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:6px;color:var(--ink);padding:8px 11px;font-size:13px;font-family:inherit;outline:none;transition:border .15s;}
.pi:focus{border-color:var(--accent);background:var(--white);}
.pi::placeholder{color:var(--ink4);}
.pi.tm{width:82px;text-align:center;}
.pa{display:flex;gap:6px;justify-content:flex-end;margin-top:14px;}
.pdel{margin-right:auto;background:transparent;border:none;color:var(--ink4);font-size:11px;cursor:pointer;font-family:inherit;padding:5px;}
.pdel:hover{color:var(--red);}
.pop-cancel{padding:7px 14px;background:var(--paper2);border:1px solid var(--line);border-radius:6px;font-size:12px;font-weight:600;color:var(--ink3);cursor:pointer;font-family:inherit;transition:all .15s;}
.pop-cancel:hover{background:var(--ink2);color:#fff;}
.pop-save{padding:7px 16px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;}
.pop-save:hover{background:#1e4488;}

/* PC 상태바 */
.sbar{height:30px;background:var(--white);border-top:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:12px;font-size:11px;color:var(--ink4);flex-shrink:0;position:relative;z-index:5;}
.sbar-dept{display:flex;align-items:center;gap:4px;}
.dot{width:7px;height:7px;border-radius:50%;}
.sbar-r{margin-left:auto;color:var(--ink4);font-size:11px;}

/* 토스트 */
.toast{position:fixed;bottom:68px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 20px;border-radius:8px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:300;box-shadow:0 4px 16px rgba(0,0,0,.2);white-space:nowrap;}
.toast.on{opacity:1;}

/* ══ 모바일 전용 ══ */
.mob-header{display:none;position:relative;z-index:20;background:var(--white);border-bottom:2px solid var(--line);box-shadow:0 4px 16px rgba(0,0,0,.06);flex-shrink:0;flex-direction:column;}
.mob-header::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--gold),var(--accent));}
.mob-hdr-top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 6px;}
.mob-logo{font-family:'Noto Serif KR',serif;font-size:13px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px;}
.mob-logo-mark{width:24px;height:24px;background:var(--accent);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;}
.mob-hdr-btns{display:flex;gap:5px;align-items:center;}
.mob-icon-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--paper2);color:var(--ink3);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;}
.mob-icon-btn:active{background:var(--accent);color:#fff;border-color:var(--accent);}
.mob-sub-btn{padding:0 10px;height:30px;background:var(--accent);color:#fff;border:none;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}
.mob-hdr-nav{display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px 10px;}
.mob-nav-btn{width:32px;height:32px;background:var(--paper2);border:1px solid var(--line);border-radius:7px;color:var(--ink3);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;}
.mob-nav-btn:active{background:var(--accent);color:#fff;border-color:var(--accent);}
.mob-week-label{font-size:12px;font-weight:700;color:var(--ink2);font-family:'Noto Serif KR',serif;text-align:center;flex:1;}
.mob-today-btn{padding:0 10px;height:32px;background:var(--paper2);border:1px solid var(--line);border-radius:7px;font-size:11px;font-weight:600;color:var(--ink3);cursor:pointer;font-family:inherit;}
.mob-today-btn:active{background:var(--accent);color:#fff;border-color:var(--accent);}

/* 모바일 하단 탭바 */
.mob-tab-bar{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--white);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.08);height:56px;}
.mob-tabs{display:flex;height:100%;align-items:stretch;}
.mob-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:transparent;cursor:pointer;font-family:inherit;padding:0;}
.mob-tab .ti{font-size:16px;line-height:1;}
.mob-tab .tl{font-size:9px;font-weight:600;color:var(--ink4);letter-spacing:.02em;}
.mob-tab.active .tl{color:var(--accent);}
.mob-tab.교무.active .tl{color:var(--c-교무);}
.mob-tab.연구.active .tl{color:var(--c-연구);}
.mob-tab.학년부.active .tl{color:var(--c-학년부);}
.mob-tab.행정.active .tl{color:var(--c-행정);}
.mob-tab.기타.active .tl{color:var(--c-기타);}

@media(max-width:768px){
  header,.sidebar,.sbar{display:none!important;}
  .mob-header{display:flex;}
  .mob-tab-bar{display:flex;}
  body{padding-bottom:56px;}
  /* 5컬럼 모두 보이게 */
  table{min-width:0;}
  col.ct{width:36px;}
  col.cd{width:calc((100% - 36px)/5);}
  thead th{padding:5px 3px 4px;height:46px;}
  .th-num{font-size:15px;}
  .th-day{font-size:9px;}
  .ev{font-size:10px;padding:2px 3px;}
  .ev .ew{display:none;}
  /* 팝업: 하단 시트 */
  .input-popup{width:100%;left:0!important;right:0;bottom:56px;top:auto!important;border-radius:14px 14px 0 0;max-height:80vh;overflow-y:auto;}
  .input-popup.on{animation:slideUp .2s ease;}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
}


/* ══ 픽셀 그리드 (연속 시간축) ══ */
:root { --px-per-min: 1.2; }   /* 1분 = 1.2px  →  1교시(50분) = 60px */
.grid-wrap { overflow: auto; position: relative; flex: 1; -webkit-overflow-scrolling: touch; }
.pg-table { border-collapse: collapse; width: 100%; min-width: 480px; table-layout: fixed; }
.pg-table colgroup col.ct { width: 48px; }
.pg-table colgroup col.cd { width: calc((100% - 48px) / 5); }
.pg-thead th { position: sticky; top: 0; z-index: 10; background: var(--white);
  border-bottom: 2px solid var(--line); border-right: 1px solid var(--line2);
  padding: 8px 8px 6px; height: 54px; text-align: left; font-size: 11px;
  font-weight: 600; color: var(--ink3); user-select: none; vertical-align: top;
  box-shadow: 0 2px 4px rgba(0,0,0,.04); cursor: default; }
.pg-thead th.tc { color: var(--accent); background: rgba(42,92,170,.04); }
.pg-thead th.th-date { cursor: pointer; transition: background .15s; }
.pg-thead th.th-date:hover { background: rgba(42,92,170,.08); }
.pg-thead th.th-date:hover .th-num { color: var(--accent); }
.pg-thead .th-num { margin-bottom: 4px; display: block; }
.pg-thead .th-day { display: block; }

/* 픽셀 그리드 본체 */
.pg-body { position: relative; }
.pg-time-col { position: sticky; left: 0; z-index: 8; float: left; width: 48px;
  background: var(--paper2); border-right: 1px solid var(--line); flex-shrink: 0; }
.pg-days { margin-left: 48px; display: flex; position: relative; }
.pg-day-col { flex: 1; position: relative; border-right: 1px solid var(--line2);
  background: var(--white); }
.pg-day-col.tc { background: rgba(42,92,170,.025); }

/* 교시 구분선 (배경) */
.pg-period-line { position: absolute; left: 0; right: 0; pointer-events: none; z-index: 1; }
.pg-period-line.class-start { border-top: 1.5px solid rgba(42,92,170,.12); }
.pg-period-line.break-start { border-top: 1px dashed rgba(0,0,0,.06); }
.pg-period-line.lunch-start { border-top: 2px solid rgba(184,150,46,.2);
  background: rgba(184,150,46,.04); }
.pg-period-bg { position: absolute; left: 0; right: 0; pointer-events: none; z-index: 0; }
.pg-period-bg.break { background: rgba(243,237,224,.6); }
.pg-period-bg.lunch { background: rgba(244,240,228,.8); }

/* 시간 레이블 */
.pg-time-label { position: absolute; left: 0; right: 0; padding: 0 2px;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
.pg-period-name { font-size: 9px; font-weight: 700; color: var(--ink2);
  font-family: 'Noto Sans KR', sans-serif; line-height: 1.2; }
.pg-period-name.break { font-size: 8px; font-weight: 400; color: var(--ink4); }
.pg-time-val { font-size: 8px; color: var(--ink4);
  font-family: 'JetBrains Mono', monospace; margin-top: 1px; }

/* 이벤트 블록 (픽셀 배치) */
.pev { position: absolute; border-radius: 4px; padding: 2px 5px; font-size: 11px;
  font-weight: 500; cursor: pointer; overflow: hidden; border-left: 3px solid transparent;
  box-shadow: 0 1px 3px rgba(0,0,0,.08); transition: filter .12s, transform .12s;
  display: flex; flex-direction: column; z-index: 5; }
.pev:hover { filter: brightness(.93); transform: scaleY(1.01); z-index: 6; }
.pev .pev-time { font-size: 9px; opacity: .7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pev .pev-title { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.pev .pev-who { display: none; }
.pev.교무 { background: rgba(42,92,170,.18); border-color: var(--c-교무); color: #0f2a5e; }
.pev.연구 { background: rgba(26,122,74,.18); border-color: var(--c-연구); color: #083d22; }
.pev.학년부 { background: rgba(184,150,46,.22); border-color: var(--c-학년부); color: #5c4400; }
.pev.행정 { background: rgba(155,44,142,.18); border-color: var(--c-행정); color: #550d4e; }
.pev.기타 { background: rgba(109,78,180,.18); border-color: var(--c-기타); color: #361e7a; }
.pev.pending { opacity: .6; border-style: dashed; }
.pg-day-click-zone { position: absolute; inset: 0; z-index: 2; cursor: cell; }
.pg-day-click-zone:hover { background: rgba(42,92,170,.03); }

/* 현재 시간선 */
.pg-now-line { position: absolute; left: 0; right: 0; z-index: 9; pointer-events: none; }
.pg-now-line::before { content: ''; display: block; height: 2px;
  background: var(--red); box-shadow: 0 0 4px rgba(192,57,43,.4); }
.pg-now-dot { position: absolute; left: -4px; top: -4px; width: 8px; height: 8px;
  background: var(--red); border-radius: 50%; }

/* ══ Daily 팝업 ══ */
.daily-bg { position: fixed; inset: 0; background: rgba(26,31,46,.45);
  backdrop-filter: blur(4px); z-index: 150; display: flex; align-items: center;
  justify-content: center; opacity: 0; pointer-events: none; transition: opacity .2s; }
.daily-bg.on { opacity: 1; pointer-events: auto; }
.daily-modal { background: var(--white); border-radius: 14px; width: 400px;
  max-width: calc(100vw - 32px); max-height: 85vh; display: flex; flex-direction: column;
  box-shadow: 0 24px 64px rgba(0,0,0,.18); transform: translateY(12px) scale(.97);
  transition: transform .2s, opacity .2s; opacity: 0;
  border-top: 3px solid var(--accent); overflow: hidden; }
.daily-bg.on .daily-modal { transform: translateY(0) scale(1); opacity: 1; }
.daily-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--line2);
  display: flex; align-items: flex-start; justify-content: space-between; flex-shrink: 0; }
.daily-head-left { display: flex; flex-direction: column; gap: 2px; }
.daily-date-num { font-family: 'Noto Serif KR', serif; font-size: 28px; font-weight: 700;
  color: var(--ink); line-height: 1; }
.daily-date-day { font-size: 12px; font-weight: 600; color: var(--ink3); margin-top: 3px; }
.daily-count { font-size: 11px; color: var(--ink4); margin-top: 2px; }
.daily-close { background: none; border: none; color: var(--ink4); font-size: 18px;
  cursor: pointer; padding: 4px 8px; border-radius: 6px; line-height: 1; }
.daily-close:hover { background: var(--paper2); color: var(--ink); }
.daily-add-btn { margin-top: 8px; padding: 5px 12px; background: var(--accent);
  color: #fff; border: none; border-radius: 6px; font-size: 11px; font-weight: 700;
  cursor: pointer; font-family: inherit; }
.daily-add-btn:hover { background: #1e4488; }
.daily-body { flex: 1; overflow-y: auto; position: relative; }
/* Daily 시간축 */
.daily-timeline { display: flex; min-height: 100%; }
.daily-time-axis { width: 52px; flex-shrink: 0; position: relative;
  background: var(--paper2); border-right: 1px solid var(--line); }
.daily-events-area { flex: 1; position: relative; background: var(--white); }
/* 교시 구분 배경 */
.dly-period-bg { position: absolute; left: 0; right: 0; pointer-events: none; }
.dly-period-bg.break { background: rgba(243,237,224,.55); }
.dly-period-bg.lunch { background: rgba(244,240,226,.8); }
.dly-period-line { position: absolute; left: 0; right: 0;
  border-top: 1px solid rgba(42,92,170,.1); pointer-events: none; }
.dly-period-line.break { border-top: 1px dashed rgba(0,0,0,.06); }
.dly-period-label { position: absolute; left: 0; right: 0; padding: 2px 4px;
  pointer-events: none; display: flex; flex-direction: column; }
.dly-period-label .dl-name { font-size: 8px; font-weight: 700; color: rgba(42,92,170,.5);
  letter-spacing: .04em; }
.dly-period-label .dl-time { font-size: 8px; color: var(--ink4);
  font-family: 'JetBrains Mono', monospace; }
.dly-period-label.break .dl-name { color: rgba(0,0,0,.25); font-weight: 400; }
/* Daily 이벤트 카드 */
.dly-ev { position: absolute; border-radius: 6px; padding: 5px 8px;
  border-left: 4px solid transparent; cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,.1); transition: filter .12s, transform .1s;
  overflow: hidden; display: flex; flex-direction: column; gap: 2px; }
.dly-ev:hover { filter: brightness(.93); transform: scale(1.01); z-index: 10; }
.dly-ev .dly-time { font-size: 10px; opacity: .7; font-family: 'JetBrains Mono', monospace; }
.dly-ev .dly-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
.dly-ev .dly-title { font-size: 13px; font-weight: 700; line-height: 1.3; flex: 1; }
.dly-ev .dly-dept-badge { font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 10px;
  background: rgba(255,255,255,.5); border: 1px solid currentColor; opacity: .7;
  white-space: nowrap; flex-shrink: 0; align-self: flex-start; margin-top: 2px; }
.dly-ev .dly-who { font-size: 11px; opacity: .8; display: flex; align-items: center; gap: 3px; }
.dly-ev.교무 { background: rgba(42,92,170,.15); border-color: var(--c-교무); color: #0f2a5e; }
.dly-ev.연구 { background: rgba(26,122,74,.15); border-color: var(--c-연구); color: #083d22; }
.dly-ev.학년부 { background: rgba(184,150,46,.2); border-color: var(--c-학년부); color: #5c4400; }
.dly-ev.행정 { background: rgba(155,44,142,.15); border-color: var(--c-행정); color: #550d4e; }
.dly-ev.기타 { background: rgba(109,78,180,.15); border-color: var(--c-기타); color: #361e7a; }
.dly-empty { padding: 40px 20px; text-align: center; color: var(--ink4); font-size: 13px; }

/* 클릭 존 */
.dly-click-zone { position: absolute; inset: 0; z-index: 1; cursor: cell; }

@media(max-width:768px) {
  .pg-table colgroup col.ct { width: 36px; }
  .pg-table colgroup col.cd { width: calc((100% - 36px) / 5); }
  .pg-thead th { padding: 5px 3px 4px; height: 46px; }
  .pg-time-col { width: 36px; }
  .pg-days { margin-left: 36px; }
  .pev { font-size: 10px; padding: 1px 3px; }
  .pev .pev-time, .pev .pev-who { display: none; }
  .pg-period-name { font-size: 8px; }
  .pg-time-val { font-size: 7px; }
  .daily-modal { max-height: 92vh; border-radius: 16px 16px 0 0;
    position: fixed; bottom: 0; width: 100%; max-width: 100%; }
  .daily-bg.on .daily-modal { transform: translateY(0) scale(1); }
}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--paper2);}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
</style>

<script>
const STORE='sched_v7';
const PERIODS=[
  {label:'1교시',start:'08:40',end:'09:30'},
  {label:'쉬는',start:'09:30',end:'09:40',isBreak:true},
  {label:'2교시',start:'09:40',end:'10:30'},
  {label:'쉬는',start:'10:30',end:'10:40',isBreak:true},
  {label:'3교시',start:'10:40',end:'11:30'},
  {label:'쉬는',start:'11:30',end:'11:40',isBreak:true},
  {label:'4교시',start:'11:40',end:'12:30'},
  {label:'점심',start:'12:30',end:'13:30',isBreak:true},
  {label:'5교시',start:'13:30',end:'14:20'},
  {label:'쉬는',start:'14:20',end:'14:30',isBreak:true},
  {label:'6교시',start:'14:30',end:'15:20'},
  {label:'쉬는',start:'15:20',end:'15:30',isBreak:true},
  {label:'7교시',start:'15:30',end:'16:20'},
];
const DAYS=['월','화','수','목','금'];
const DAY_START='08:40', DAY_END='16:20';
const PX_PER_MIN=1.4; // 1분 = 1.4px

const pad=n=>String(n).padStart(2,'0');
function toMin(t){const[h,m]=t.split(':').map(Number);return h*60+m;}
function minToTop(t){return(toMin(t)-toMin(DAY_START))*PX_PER_MIN;}
const TOTAL_MIN=toMin(DAY_END)-toMin(DAY_START);
const TOTAL_H=TOTAL_MIN*PX_PER_MIN;

let wo=0,events=JSON.parse(localStorage.getItem(STORE)||'[]'),deptFilter='전체';
let pop={on:false,date:null,eid:null,d:'교무'};
let dailyDate=null;
const apiUrl='https://script.google.com/macros/s/AKfycbyXw6s_6UWYYI-BZs2XeVtw-0dGdoGR19QNWFjzw0VFFLZBOHAgjRhDNGxxatKqysiY/exec';

function ds(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function weekDates(o){const d=new Date(),day=d.getDay(),diff=day===0?-6:1-day;d.setDate(d.getDate()+diff+o*7);return Array.from({length:5},(_,i)=>{const n=new Date(d);n.setDate(d.getDate()+i);return n;});}
function weekRange(){const w=weekDates(wo);return{s:ds(w[0]),e:ds(w[4])};}

async function apiFetch(p){if(!apiUrl)return null;try{const r=await fetch(apiUrl+'?'+new URLSearchParams(p));return r.json();}catch{return null;}}
async function apiPost(b){if(!apiUrl)return null;try{const r=await fetch(apiUrl,{method:'POST',body:JSON.stringify(b),headers:{'Content-Type':'text/plain'}});return r.json();}catch{return null;}}

async function loadAll(){
  setLov(true);
  const{s,e}=weekRange();
  if(apiUrl){const r=await apiFetch({action:'getEvents',startDate:s,endDate:e});if(r?.events){events=events.filter(ev=>ev.date<s||ev.date>e);events=[...events,...r.events];saveLocal();}}
  setLov(false);render();
}

// ── 픽셀 그리드 렌더 ──
function render(){
  const dates=weekDates(wo),today=ds(new Date()),{s,e}=weekRange();
  const full=`${dates[0].getFullYear()}년 ${dates[0].getMonth()+1}월 ${dates[0].getDate()}일 — ${dates[4].getMonth()+1}월 ${dates[4].getDate()}일`;
  const mob=`${dates[0].getMonth()+1}/${dates[0].getDate()} — ${dates[4].getMonth()+1}/${dates[4].getDate()}`;
  document.getElementById('wl').textContent=full;
  document.getElementById('wl2').textContent=mob;

  // ── 헤더 (날짜행) ──
  const thead=document.getElementById('thead');
  thead.innerHTML='';
  const hr=document.createElement('tr');
  const emptyTh=document.createElement('th');emptyTh.textContent='';hr.appendChild(emptyTh);
  dates.forEach((d,i)=>{
    const date=ds(d),th=document.createElement('th');
    th.className='th-date'+(date===today?' tc':'');
    th.innerHTML=`<span class="th-num">${d.getDate()}</span><br><span class="th-day">${DAYS[i]}</span>`;
    th.addEventListener('click',()=>openDaily(date,d));
    hr.appendChild(th);
  });
  thead.appendChild(hr);

  // ── 시간축 컬럼 ──
  const timeCol=document.getElementById('pg-time-col');
  timeCol.style.height=TOTAL_H+'px';
  timeCol.style.position='relative';
  timeCol.innerHTML='';
  PERIODS.forEach(p=>{
    const top=minToTop(p.start);
    const h=(toMin(p.end)-toMin(p.start))*PX_PER_MIN;
    const lbl=document.createElement('div');
    lbl.className='pg-time-label';
    lbl.style.cssText=`position:absolute;top:${top}px;height:${h}px;left:0;right:0;padding:3px 2px 0;overflow:hidden;`;
    lbl.innerHTML=`<span class="pg-period-name${p.isBreak?' break':''}">${p.label}</span><span class="pg-time-val">${p.start}</span>`;
    timeCol.appendChild(lbl);
  });

  // ── 날짜 컬럼들 ──
  const pgDays=document.getElementById('pg-days');
  pgDays.style.height=TOTAL_H+'px';
  pgDays.innerHTML='';

  const filtered=deptFilter==='전체'?events:events.filter(ev=>ev.dept===deptFilter);

  dates.forEach((d,i)=>{
    const date=ds(d);
    const col=document.createElement('div');
    col.className='pg-day-col'+(date===today?' tc':'');
    col.style.height=TOTAL_H+'px';

    // 교시 배경 + 구분선
    PERIODS.forEach(p=>{
      const top=minToTop(p.start);
      const h=(toMin(p.end)-toMin(p.start))*PX_PER_MIN;
      if(p.isBreak){
        const bg=document.createElement('div');
        bg.className='pg-period-bg '+(p.label==='점심'?'lunch':'break');
        bg.style.cssText=`top:${top}px;height:${h}px;`;
        col.appendChild(bg);
      }
      const line=document.createElement('div');
      line.className='pg-period-line '+(p.isBreak?'break-start':'class-start');
      line.style.top=top+'px';
      col.appendChild(line);
    });

    // 클릭존 (빈 영역 클릭 → 입력 팝업)
    const clickZone=document.createElement('div');
    clickZone.className='pg-day-click-zone';
    clickZone.addEventListener('click',e2=>{
      if(e2.target.closest('.pev'))return;
      const rect=col.getBoundingClientRect();
      const clickY=e2.clientY-rect.top;
      const clickMin=Math.round(clickY/PX_PER_MIN)+toMin(DAY_START);
      const hh=Math.floor(clickMin/60),mm=Math.round((clickMin%60)/5)*5;
      const startT=`${pad(hh)}:${pad(Math.min(mm,59))}`;
      const endMin=clickMin+50;
      const eh=Math.floor(endMin/60),em=endMin%60;
      const endT=`${pad(eh)}:${pad(em)}`;
      openPop(e2,date,startT,endT,null);
    });
    col.appendChild(clickZone);

    // 이벤트 배치 (겹치는 이벤트 옆으로)
    const dayEvs=filtered.filter(ev=>ev.date===date).sort((a,b)=>toMin(a.startTime||DAY_START)-toMin(b.startTime||DAY_START));
    const cols_=[]; // 충돌 컬럼 계산
    dayEvs.forEach(ev=>{
      const evStart=ev.allday?DAY_START:(ev.startTime||DAY_START);
      const evEnd=ev.allday?DAY_END:(ev.endTime||DAY_END);
      let placed=false;
      for(let c=0;c<cols_.length;c++){
        const last=cols_[c][cols_[c].length-1];
        const lastEnd=last.allday?DAY_END:(last.endTime||DAY_END);
        if(toMin(evStart)>=toMin(lastEnd)){cols_[c].push(ev);placed=true;break;}
      }
      if(!placed)cols_.push([ev]);
    });
    const numCols=cols_.length||1;
    cols_.forEach((colEvs,ci)=>{
      colEvs.forEach(ev=>{
        const evStart=ev.allday?DAY_START:(ev.startTime||DAY_START);
        const evEnd=ev.allday?DAY_END:(ev.endTime||DAY_END);
        const top=minToTop(evStart);
        const h=Math.max(20,(toMin(evEnd)-toMin(evStart))*PX_PER_MIN-2);
        const w=`calc(${100/numCols}% - 4px)`;
        const left=`calc(${ci*100/numCols}% + 2px)`;
        const b=document.createElement('div');
        b.className=`pev ${ev.dept}${ev._p?' pending':''}`;
        b.dataset.id=ev.id;
        b.style.cssText=`top:${top}px;height:${h}px;width:${w};left:${left};`;
        b.innerHTML=`<span class="pev-time">${ev.allday?'종일':evStart+'~'+evEnd}</span><span class="pev-title">${ev.title}</span>`;
        b.addEventListener('click',e2=>{
          e2.stopPropagation();
          const evObj=events.find(x=>x.id===b.dataset.id);
          if(evObj)openPop(e2,evObj.date,evObj.startTime||'09:00',evObj.endTime||'10:00',evObj.id);
        });
        col.appendChild(b);
      });
    });

    // 현재 시간선 (오늘만)
    if(date===today){
      const now=new Date();
      const nowT=`${pad(now.getHours())}:${pad(now.getMinutes())}`;
      if(nowT>=DAY_START&&nowT<=DAY_END){
        const line=document.createElement('div');
        line.className='pg-now-line';
        line.style.top=minToTop(nowT)+'px';
        line.innerHTML='<span class="pg-now-dot"></span>';
        col.appendChild(line);
      }
    }
    pgDays.appendChild(col);
  });

  document.getElementById('sc').textContent=`이번주 업무 ${events.filter(ev=>ev.date>=s&&ev.date<=e).length}건`;
}

// ── 입력 팝업 ──
function openPop(e,date,startT,endT,eid){
  const P=document.getElementById('ipop');
  pop={on:true,date,eid,d:pop.d};
  const ev=eid?events.find(x=>x.id===eid):null;
  if(ev)pop.d=ev.dept;
  document.querySelectorAll('.pd-btn').forEach(b=>b.classList.toggle('active',b.dataset.d===pop.d));
  document.getElementById('ptitle').value=ev?.title??'';
  document.getElementById('pwho').value=ev?.who??'';
  document.getElementById('pst').value=ev?.startTime??startT??'09:00';
  document.getElementById('pet').value=ev?.endTime??endT??'10:00';
  document.getElementById('pad').checked=ev?.allday??false;
  document.getElementById('pdel').style.display=eid?'inline-block':'none';
  if(window.innerWidth>768){
    const x=Math.min(e.clientX,innerWidth-330),y=Math.min(e.clientY+8,innerHeight-280);
    P.style.cssText=`left:${x}px;top:${y}px;`;
  }
  P.classList.add('on');
  setTimeout(()=>document.getElementById('ptitle').focus(),50);
}
function closePop(){document.getElementById('ipop').classList.remove('on');pop.on=false;}

async function savePop(){
  const title=document.getElementById('ptitle').value.trim();
  if(!title){document.getElementById('ptitle').focus();return;}
  const ev={
    id:pop.eid||(apiUrl?'LOCAL_'+Date.now():'L'+Date.now()),
    date:pop.date,dept:pop.d,title,
    who:document.getElementById('pwho').value.trim(),
    startTime:document.getElementById('pst').value,
    endTime:document.getElementById('pet').value,
    allday:document.getElementById('pad').checked,
    _p:!!apiUrl
  };
  if(pop.eid){const i=events.findIndex(x=>x.id===pop.eid);if(i!==-1)events[i]=ev;}
  else events.push(ev);
  saveLocal();closePop();render();
  if(dailyDate===pop.date)renderDaily(dailyDate);
  toast('저장 중...');
  const res=await apiPost({action:'saveEvent',event:ev});
  if(res?.id){const i=events.findIndex(x=>x.id===ev.id);if(i!==-1){events[i].id=res.id;events[i]._p=false;}}
  else if(res?.success){const i=events.findIndex(x=>x.id===ev.id);if(i!==-1)events[i]._p=false;}
  saveLocal();render();
  if(dailyDate===pop.date)renderDaily(dailyDate);
  toast(pop.eid?'수정 완료 ✓':'저장 완료 ✓');
}

async function delPop(){
  if(!pop.eid||!confirm('삭제할까요?'))return;
  const id=pop.eid;events=events.filter(x=>x.id!==id);
  saveLocal();closePop();render();
  if(dailyDate===pop.date)renderDaily(dailyDate);
  await apiPost({action:'deleteEvent',id});toast('삭제됨');
}

// ── Daily 팝업 ──
function openDaily(date,dateObj){
  dailyDate=date;
  const dayNames=['일','월','화','수','목','금','토'];
  document.getElementById('dlyDateNum').textContent=dateObj.getDate();
  document.getElementById('dlyDateDay').textContent=`${dateObj.getMonth()+1}월 ${dateObj.getDate()}일 (${dayNames[dateObj.getDay()]})`;
  renderDaily(date);
  document.getElementById('dailyBg').classList.add('on');
}

function closeDaily(){
  document.getElementById('dailyBg').classList.remove('on');
  dailyDate=null;
}

function renderDaily(date){
  const dayEvs=events.filter(ev=>ev.date===date).sort((a,b)=>toMin(a.startTime||DAY_START)-toMin(b.startTime||DAY_START));
  document.getElementById('dlyCount').textContent=`업무 ${dayEvs.length}건`;

  const axis=document.getElementById('dlyAxis');
  const area=document.getElementById('dlyArea');
  axis.style.height=TOTAL_H+'px';
  axis.style.position='relative';
  area.style.height=TOTAL_H+'px';
  area.style.position='relative';
  axis.innerHTML='';area.innerHTML='';

  // 시간축 레이블 + 교시 배경
  PERIODS.forEach(p=>{
    const top=minToTop(p.start);
    const h=(toMin(p.end)-toMin(p.start))*PX_PER_MIN;

    // 시간 축 레이블
    const lbl=document.createElement('div');
    lbl.className='dly-period-label'+(p.isBreak?' break':'');
    lbl.style.cssText=`position:absolute;top:${top}px;height:${h}px;left:0;right:0;padding:3px 4px 0;overflow:hidden;`;
    lbl.innerHTML=`<span class="dl-name">${p.label}</span><span class="dl-time">${p.start}</span>`;
    axis.appendChild(lbl);

    // 이벤트 영역 배경 + 구분선
    if(p.isBreak){
      const bg=document.createElement('div');
      bg.className='dly-period-bg '+(p.label==='점심'?'lunch':'break');
      bg.style.cssText=`position:absolute;top:${top}px;height:${h}px;left:0;right:0;pointer-events:none;`;
      area.appendChild(bg);
    }
    const line=document.createElement('div');
    line.className='dly-period-line'+(p.isBreak?' break':'');
    line.style.cssText=`position:absolute;top:${top}px;left:0;right:0;pointer-events:none;`;
    area.appendChild(line);
  });

  // 클릭존
  const clickZone=document.createElement('div');
  clickZone.className='dly-click-zone';
  clickZone.addEventListener('click',e2=>{
    if(e2.target.closest('.dly-ev'))return;
    const rect=area.getBoundingClientRect();
    const clickMin=Math.round((e2.clientY-rect.top)/PX_PER_MIN)+toMin(DAY_START);
    const hh=Math.floor(clickMin/60),mm=Math.round((clickMin%60)/5)*5;
    const startT=`${pad(hh)}:${pad(Math.min(mm,59))}`;
    const endMin=clickMin+50;
    const endT=`${pad(Math.floor(endMin/60))}:${pad(endMin%60)}`;
    openPop(e2,date,startT,endT,null);
  });
  area.appendChild(clickZone);

  if(!dayEvs.length){
    const emp=document.createElement('div');
    emp.className='dly-empty';emp.textContent='등록된 업무가 없습니다.';
    area.appendChild(emp);
    return;
  }

  // 겹침 처리
  const cols_=[];
  dayEvs.forEach(ev=>{
    const evStart=ev.allday?DAY_START:(ev.startTime||DAY_START);
    const evEnd=ev.allday?DAY_END:(ev.endTime||DAY_END);
    let placed=false;
    for(let c=0;c<cols_.length;c++){
      const last=cols_[c][cols_[c].length-1];
      const lastEnd=last.allday?DAY_END:(last.endTime||DAY_END);
      if(toMin(evStart)>=toMin(lastEnd)){cols_[c].push(ev);placed=true;break;}
    }
    if(!placed)cols_.push([ev]);
  });
  const numCols=cols_.length||1;

  cols_.forEach((colEvs,ci)=>{
    colEvs.forEach(ev=>{
      const evStart=ev.allday?DAY_START:(ev.startTime||DAY_START);
      const evEnd=ev.allday?DAY_END:(ev.endTime||DAY_END);
      const top=minToTop(evStart);
      const h=Math.max(28,(toMin(evEnd)-toMin(evStart))*PX_PER_MIN-3);
      const w=`calc(${100/numCols}% - 6px)`;
      const left=`calc(${ci*100/numCols}% + 3px)`;
      const card=document.createElement('div');
      card.className=`dly-ev ${ev.dept}${ev._p?' pending':''}`;
      card.style.cssText=`top:${top}px;height:${h}px;width:${w};left:${left};z-index:5;`;
      const deptLabel={'교무':'교무부','연구':'연구부','학년부':'학년부','행정':'행정실','기타':'기타'}[ev.dept]||ev.dept;
      card.innerHTML=
        `<span class="dly-time">${ev.allday?'종일':evStart+' ~ '+evEnd}</span>`+
        `<div class="dly-title-row"><span class="dly-title">${ev.title}</span><span class="dly-dept-badge">${deptLabel}</span></div>`+
        (ev.who?`<span class="dly-who">📍 ${ev.who}</span>`:'');
      card.addEventListener('click',e2=>{
        e2.stopPropagation();
        openPop(e2,ev.date,ev.startTime||'09:00',ev.endTime||'10:00',ev.id);
      });
      area.appendChild(card);
    });
  });

  // 현재 시간선
  const now=new Date();
  if(date===ds(now)){
    const nowT=`${pad(now.getHours())}:${pad(now.getMinutes())}`;
    if(nowT>=DAY_START&&nowT<=DAY_END){
      const line=document.createElement('div');
      line.className='pg-now-line';
      line.style.cssText=`position:absolute;top:${minToTop(nowT)}px;left:0;right:0;z-index:9;pointer-events:none;`;
      line.innerHTML='<span class="pg-now-dot"></span>';
      area.appendChild(line);
    }
  }
}

function openSub(){
  const subUrl='subscribe-popup.html'+(apiUrl?`?api=${encodeURIComponent(apiUrl)}`:'');
  const w=480,h=680,left=Math.round(screen.width/2-w/2),top=Math.round(screen.height/2-h/2);
  window.open(subUrl,'구독신청',`width=${w},height=${h},left=${left},top=${top},resizable=yes,scrollbars=yes,toolbar=no,menubar=no,location=no`);
}

async function copySchedule(){
  if(apiUrl){const{s,e}=weekRange();const r=await apiFetch({action:'getWeekSummary',startDate:s,endDate:e}).catch(()=>null);if(r?.text){navigator.clipboard.writeText(r.text);toast('주간표 복사됨 ✓');return;}}
  const dates=weekDates(wo);
  let out=`📅 주간업무표 (${dates[0].getMonth()+1}/${dates[0].getDate()} ~ ${dates[4].getMonth()+1}/${dates[4].getDate()})\n\n`;
  dates.forEach((d,i)=>{const date=ds(d);const wk=events.filter(ev=>ev.date===date).sort((a,b)=>toMin(a.startTime||'00:00')-toMin(b.startTime||'00:00'));if(wk.length){out+=`[${DAYS[i]} ${d.getMonth()+1}/${d.getDate()}]\n`;wk.forEach(ev=>out+=`  • [${ev.dept}] ${ev.title}${ev.who?' ('+ev.who+')':''} ${ev.allday?'종일':ev.startTime+'~'+ev.endTime}\n`);out+='\n';}});
  navigator.clipboard.writeText(out);toast('주간표 복사됨 ✓');
}

function saveLocal(){localStorage.setItem(STORE,JSON.stringify(events));}
function setLov(v){document.getElementById('lov').classList.toggle('hide',!v);}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200);}

// ── 이벤트 바인딩 ──
document.getElementById('pw').addEventListener('click',()=>{wo--;render();loadAll();});
document.getElementById('nw').addEventListener('click',()=>{wo++;render();loadAll();});
document.getElementById('tw').addEventListener('click',()=>{wo=0;render();loadAll();});
document.getElementById('pw2').addEventListener('click',()=>{wo--;render();loadAll();});
document.getElementById('nw2').addEventListener('click',()=>{wo++;render();loadAll();});
document.getElementById('tw2').addEventListener('click',()=>{wo=0;render();loadAll();});
document.getElementById('rf').addEventListener('click',loadAll);
document.getElementById('rf2').addEventListener('click',loadAll);
document.getElementById('sh').addEventListener('click',copySchedule);
document.getElementById('sh2').addEventListener('click',copySchedule);
document.getElementById('subBtn').addEventListener('click',openSub);
document.getElementById('subBtn2').addEventListener('click',openSub);
document.getElementById('dlyClose').addEventListener('click',closeDaily);
document.getElementById('dlyAddBtn').addEventListener('click',e=>{
  const fakeE={clientX:window.innerWidth/2-160,clientY:200};
  openPop(fakeE,dailyDate,'09:00','10:00',null);
});
document.getElementById('dailyBg').addEventListener('click',e=>{if(e.target===document.getElementById('dailyBg'))closeDaily();});

document.querySelectorAll('.d-tab').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.d-tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');deptFilter=t.dataset.d;render();}));
document.querySelectorAll('.mob-tab[data-d]').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.mob-tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');deptFilter=t.dataset.d;render();}));
document.querySelectorAll('.pd-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.pd-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');pop.d=b.dataset.d;}));
document.getElementById('psv').addEventListener('click',savePop);
document.getElementById('pcx').addEventListener('click',closePop);
document.getElementById('pdel').addEventListener('click',delPop);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(pop.on)closePop();else if(dailyDate)closeDaily();return;}
  if(!pop.on)return;
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();savePop();}
});
document.addEventListener('mousedown',e=>{
  if(pop.on&&!e.target.closest('#ipop')&&!e.target.closest('.pev')&&!e.target.closest('.dly-ev'))closePop();
});
document.getElementById('pad').addEventListener('change',e=>{
  ['pst','pet'].forEach(id=>{const el=document.getElementById(id);el.style.opacity=e.target.checked?.3:1;el.style.pointerEvents=e.target.checked?'none':'';});
});

// 현재 시간선 1분마다 갱신
setInterval(render,60000);

render();loadAll();
</script>
